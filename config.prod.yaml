# ============================================================
#  자주 바꾸는 설정
#  dev/prod 구분, 저장 위치, 외부 연동처럼 환경마다 달라질 수 있는 값입니다.
# ============================================================
env: "prod"
server_host: "0.0.0.0"
server_port: 48080
server_reload: false
db_path: "./data.prod.db"
thumbnail_dir: "./thumbnails-prod"
download_dir: "./downloads"

# ============================================================
#  Telegram 알림
#  알림을 쓰지 않으면 빈 값으로 둡니다.
# ============================================================
telegram_bot_token: ""
telegram_chat_id: ""

# ============================================================
#  원격 동기화
#  원격 동기화 토글과 DSN은 설정 파일이 아니라 환경 변수 전용입니다.
#  BRIEFTUBE_REMOTE_SYNC_DSN / BRIEFTUBE_REMOTE_SYNC_ENABLED
# ============================================================

# ============================================================
#  작업 빈도와 timeout
#  RSS, yt-dlp, HTTP, LLM 호출 간격과 대기 시간을 조절합니다.
# ============================================================
polling_interval_minutes: 30
rss_timeout_seconds: 20
rss_inter_channel_delay_seconds: 2.0
rss_fetcher_mode: "yt_dlp"
yt_dlp_playlist_limit: 15
yt_dlp_timeout_seconds: 60
yt_dlp_longform_min_seconds: 180
http_timeout_seconds: 30
llm_timeout_seconds: 120

# ============================================================
#  다운로드 처리
#  다운로드 동시 실행 수와 단일 작업 timeout입니다.
# ============================================================
download_max_concurrent: 2
download_timeout_seconds: 1800

# ============================================================
#  자막 수집 속도와 재시도
#  요청 간격, backoff, cooldown, adaptive throttle 정책입니다.
# ============================================================
transcript_request_interval_seconds: 20
transcript_retry_base_delay_seconds: 180
transcript_retry_max_delay_seconds: 7200
transcript_retry_max_attempts: 8
transcript_fetch_timeout_seconds: 45
transcript_jitter_ratio: 0.30
transcript_adaptive_enabled: true
transcript_adaptive_max_factor: 8.0
transcript_hard_cooldown_base_seconds: 300
transcript_hard_cooldown_max_seconds: 3600
transcript_recovery_success_window: 5
transcript_general_error_slowdown_multiplier: 1.25
transcript_channel_min_interval_seconds: 180
transcript_channel_pick_lookahead: 20
transcript_channel_hard_cooldown_seconds: 900
transcript_breaker_half_open_probe_count: 1

# ============================================================
#  로그 출력, 위치와 보관량
#  콘솔/파일 로그 레벨, 저장 위치, rotation 정책입니다.
# ============================================================
log_level: "AUTO"
log_to_file: true
log_dir: "./logs/prod"
log_file_name: "brieftube-prod.log"
log_file_max_bytes: 10485760
log_file_backup_count: 10
log_console_color: "AUTO"

# ============================================================
#  거의 바꾸지 않는 고급 설정
#  장애 보호, 워커 조율처럼 기본값 유지가 권장되는 값입니다.
# ============================================================
max_retry_count: 3
rss_channel_deactivate_after_fails: 3
rss_consecutive_error_abort_threshold: 5

# ============================================================
#  자막 워커 세부 정책
#  worker batch 크기와 idle sleep 주기를 조절합니다.
# ============================================================
transcript_fetch_batch_size: 1
transcript_idle_sleep_seconds: 5

# ============================================================
#  로그 표시와 반복 로그 억제
#  반복 로그 suppression과 의존성 로그 레벨을 조절합니다.
# ============================================================
log_noise_window_seconds: 60
log_noise_suppress_threshold: 1
log_dependency_level: "WARNING"
