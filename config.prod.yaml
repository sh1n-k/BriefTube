# 자주 바꾸는 설정
# dev/prod 구분, 저장 위치, 외부 연동처럼 환경마다 달라질 가능성이 큰 값입니다.
env: "prod"
db_path: "./data.prod.db"
thumbnail_dir: "./thumbnails-prod"
download_dir: "./downloads"

# Telegram 알림을 쓰지 않으면 빈 값으로 둡니다.
telegram_bot_token: ""
telegram_chat_id: ""

# 작업 빈도와 timeout
polling_interval_minutes: 30
rss_timeout_seconds: 20
rss_inter_channel_delay_seconds: 2.0
rss_fetcher_mode: "rss_then_yt_dlp"
yt_dlp_playlist_limit: 15
yt_dlp_timeout_seconds: 60
yt_dlp_longform_min_seconds: 180
http_timeout_seconds: 30
llm_timeout_seconds: 120

# 다운로드 처리
download_max_concurrent: 2
download_timeout_seconds: 1800

# 자막 수집 속도와 재시도
transcript_request_interval_seconds: 20
transcript_retry_base_delay_seconds: 180
transcript_retry_max_delay_seconds: 7200

# 로그 출력, 위치와 보관량
log_level: "AUTO"
log_to_file: true
log_dir: "./logs/prod"
log_file_name: "brieftube-prod.log"
log_file_max_bytes: 10485760
log_file_backup_count: 10

# 거의 바꾸지 않는 고급 설정
# 장애 보호, 워커 조율, 로그 노이즈 억제처럼 기본값 유지가 권장되는 값입니다.
max_retry_count: 3
rss_channel_deactivate_after_fails: 3
rss_consecutive_error_abort_threshold: 5

# 자막 워커 세부 정책
transcript_fetch_batch_size: 1
transcript_idle_sleep_seconds: 5

# 로그 표시와 반복 로그 억제
log_noise_window_seconds: 60
log_noise_suppress_threshold: 1
log_dependency_level: "WARNING"
