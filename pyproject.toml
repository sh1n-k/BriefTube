[project]
name = "brieftube"
version = "0.1.0"
description = "Local web app for collecting and restructuring YouTube investment content"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "aiosqlite>=0.22.0",
  "httpx>=0.28.0",
  "yt-dlp>=2026.2.21",
  "youtube-transcript-api>=1.2.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-playwright>=0.6.0",
]

[tool.uvicorn]
factory = false
host = "0.0.0.0"
port = 8000

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = ["e2e: Playwright browser-based end-to-end tests"]

[tool.setuptools.packages.find]
include = ["app*"]
